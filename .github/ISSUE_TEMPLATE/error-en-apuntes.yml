name: Error en unos apuntes
description: Una errata, una cuenta que no sale, una figura mal dibujada o un tema incompleto
labels: ["contenido"]
body:
  - type: markdown
    attributes:
      value: |
        Si lo que has encontrado es una clave, un dato personal o material con
        derechos de autor, **no lo cuentes aquí**: sigue el
        [SECURITY.md](https://github.com/ElblogdeIsmael/ElblogdeIsmael.github.io/blob/main/.github/SECURITY.md).

  - type: input
    id: asignatura
    attributes:
      label: Asignatura
      description: El código y el curso, si lo sabes.
      placeholder: FBD · tercero
    validations:
      required: true

  - type: input
    id: donde
    attributes:
      label: Dónde
      description: La página del PDF, el tema del visor o la URL de la ficha.
      placeholder: Tema 3, página 12 · /viewer/?file=Subjects/Third/FBD/...
    validations:
      required: true

  - type: textarea
    id: que
    attributes:
      label: Qué está mal
      description: Con lo que dice ahora y lo que debería decir, si lo tienes claro.
    validations:
      required: true

  - type: textarea
    id: fuente
    attributes:
      label: En qué te apoyas
      description: >
        Opcional, pero ayuda mucho. La guía docente, un manual, un apunte de
        clase. **No pegues material del profesorado ni escaneos de libros.**
